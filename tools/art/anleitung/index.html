<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Blechy erklärt BLECHTRIBE</title>
<!-- Instagram slides, 1080 x 1080 each, in the app's own design system. The slides are built from STEPS below.
     Render: node tools/art/anleitung/render.mjs (PNG per slide, MP4 with Blechy moving). -->
<link rel="stylesheet" href="../../../site/design/colors.min.css">
<link rel="stylesheet" href="../../../site/design/root.min.css">
<link rel="stylesheet" href="../../../site/app.css">
<style>
  body { background: var(--bg-0); margin: 0; }
  .slide {
    position: relative; width: 1080px; height: 1080px; overflow: hidden; margin: 0 auto var(--space-10);
    background: var(--bg-0); font-family: var(--font-sans); color: var(--fg-0);
  }
  .n { position: absolute; right: var(--space-10); top: var(--space-8); font: 500 24px var(--font-mono); color: var(--fg-2); }
  /* a part of the app screenshot (2x), placed by --x, --y (css px of the app) and --s (scale) */
  .shot {
    position: absolute; left: 0; top: 0; width: calc(1280px * var(--s)); max-width: none;
    transform: translate(calc(var(--x) * var(--s) * -1px), calc(var(--y) * var(--s) * -1px));
  }
  .spot {
    position: absolute; border: 4px solid var(--color-accent-primary); border-radius: var(--radius-xl);
    box-shadow: 0 0 0 9999px rgb(0 0 0 / .78);
  }
  .spot.ring { box-shadow: none; }
  .blechy { position: absolute; width: 224px; image-rendering: pixelated; filter: invert(1); mix-blend-mode: screen; }
  .blechy.flip { transform: scaleX(-1); }
  .slide .b2 { display: none; }
  .slide.alt .b1 { display: none; }
  .slide.alt .b2 { display: block; }
  .say {
    position: absolute; padding: var(--space-5) var(--space-6); border-radius: var(--radius-xl);
    background: var(--bg-1); border: 1px solid var(--bg-3); color: var(--fg-0);
    font: 500 44px/1.25 var(--font-sans); box-shadow: 0 var(--space-4) var(--space-12) rgb(0 0 0 / .5);
  }
  .say code, .say kbd { font: 500 .85em var(--font-mono); color: var(--color-accent-primary); }
  /* file window */
  .win {
    position: absolute; left: var(--space-12); right: var(--space-12); top: 96px; height: 560px;
    border-radius: var(--radius-2xl); background: var(--bg-1); border: 1px solid var(--bg-3); overflow: hidden;
    display: grid; grid-template-columns: 280px 1fr; grid-template-rows: 64px 1fr;
  }
  .win .bar { grid-column: 1 / 3; display: flex; align-items: center; gap: var(--space-3); padding: 0 var(--space-6);
    border-bottom: 1px solid var(--bg-3); font: 500 24px var(--font-mono); color: var(--fg-1); }
  .win .side { border-right: 1px solid var(--bg-3); padding: var(--space-4); }
  .win .side div, .win .row { display: flex; align-items: center; gap: var(--space-4); height: 72px; padding: 0 var(--space-4);
    border-radius: var(--radius-md); font-size: 30px; color: var(--fg-1); }
  .win .row { font-size: 32px; color: var(--fg-0); }
  .win .list { padding: var(--space-4); }
  .ico { width: 40px; height: 32px; flex: none; }
  .dialog { position: absolute; left: 160px; right: 160px; top: 220px; padding: var(--space-8); border-radius: var(--radius-2xl);
    background: var(--bg-2); border: 1px solid var(--bg-3); font-size: 32px; box-shadow: 0 var(--space-6) var(--space-16) rgb(0 0 0 / .6); }
  .dialog .btns { display: flex; justify-content: flex-end; gap: var(--space-4); margin-top: var(--space-8); }
  .btn { padding: var(--space-3) var(--space-6); border-radius: var(--radius-md); border: 1px solid var(--bg-3); font-size: 30px; }
  /* device */
  .lcd { position: absolute; left: 156px; top: 72px; width: 768px; image-rendering: pixelated; border-radius: var(--radius-sm); }
  .lcd.two { width: 456px; top: 140px; }
  .key { position: absolute; top: 476px; width: 190px; height: 110px; border-radius: var(--radius-md);
    background: var(--bg-2); border: 1px solid var(--bg-3); display: grid; place-items: center;
    font: 500 30px var(--font-mono); color: var(--fg-1); }
  .panel { position: absolute; left: var(--space-16); right: var(--space-16); border-radius: var(--radius-2xl);
    background: var(--bg-1); border: 1px solid var(--bg-3); padding: var(--space-8); }
  .dl { display: inline-block; margin-top: var(--space-10); padding: var(--space-6) var(--space-10); border-radius: var(--radius-md);
    background: #e4007c; color: #fff; font: 700 40px var(--font-sans); letter-spacing: .04em; }
  .prow { display: flex; justify-content: space-between; padding: var(--space-4) var(--space-5); margin-top: var(--space-3);
    border: 1px solid var(--bg-3); border-radius: var(--radius-md); font: 500 28px var(--font-mono); color: var(--fg-1); }
</style>
</head>
<body>
<template id="folder"><svg class="ico" viewBox="0 0 40 32"><path d="M2 6a3 3 0 0 1 3-3h10l4 4h16a3 3 0 0 1 3 3v17a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3z" fill="var(--color-accent-primary)"/></svg></template>
<template id="file"><svg class="ico" viewBox="0 0 40 32"><path d="M10 1h14l8 8v22H10z" fill="var(--fg-1)"/><path d="M24 1v8h8" fill="var(--bg-3)"/></svg></template>
<template id="card"><svg class="ico" viewBox="0 0 40 32"><path d="M10 2h16l6 6v22H10z" fill="var(--fg-1)"/><rect x="13" y="5" width="3" height="7" fill="var(--bg-1)"/><rect x="18" y="5" width="3" height="7" fill="var(--bg-1)"/><rect x="23" y="5" width="3" height="7" fill="var(--bg-1)"/></svg></template>

<script>
/* Blechy points with the tip of his finger at `at` [x, y]. Fingertips in the 4x sprite (224 px): */
const POSES = {
  right: { a: "point-1", b: "point-2", tip: [228, 104], flip: false },
  left:  { a: "point-1", b: "point-2", tip: [-4, 104], flip: true },
  up:    { a: "point-up-1", b: "point-up-2", tip: [220, 56], flip: false },
  upleft:{ a: "point-up-1", b: "point-up-2", tip: [4, 56], flip: true },
  wave:  { a: "wave-1", b: "wave-2", tip: [112, 112], flip: false },
};
const icon = id => document.getElementById(id).innerHTML;
const KEYS = ["EXIT", "MENU", "EDIT ◀", "EDIT ▶"];
const keyX = i => 120 + i * 220;

const app = (x, y, s) => `<img class="shot" src="img/app-patcher.png" style="--x:${x};--y:${y};--s:${s}">`;
function files(path, side, rows) {
  return `<div class="win"><div class="bar">${path}</div>
    <div class="side">${side.map(([i, t]) => `<div>${icon(i)}${t}</div>`).join("")}</div>
    <div class="list">${rows.map(([i, t]) => `<div class="row">${icon(i)}${t}</div>`).join("")}</div></div>`;
}
const SIDE = [["folder", "Schreibtisch"], ["folder", "Downloads"], ["card", "SD-KARTE"]];
const device = (lcd, key) => `<img class="lcd" src="img/${lcd}.png">` +
  KEYS.map((k, i) => `<div class="key" style="left:${keyX(i)}px">${k}</div>`).join("");
// spot and Blechy on a key; the bubble below
const onKey = (i, say) => ({ ring: true, spot: [keyX(i) - 8, 468, 206, 126], pose: i < 2 ? "up" : "upleft", at: [keyX(i) + 95, 606], say: [96, 0, 888, say] });

const STEPS = [
  { html: `<div class="panel" style="top:300px;padding:var(--space-16) var(--space-10) var(--space-10)">
      <div style="font:500 32px var(--font-mono);color:var(--fg-1)">github.com/KuhlerBuhler/<b style="color:var(--fg-0)">kuhlers-gelumpe</b></div>
      <div class="dl">⬇ APP HERUNTERLADEN</div></div>`,
    ring: true, spot: ".dl", pose: "left", say: [96, 0, 888, "Moin! Auf GitHub <b>kuhlers-gelumpe</b>, dann der rosa Knopf."] },
  { html: `<svg viewBox="0 0 960 600" width="960" height="600" style="position:absolute;left:60px;top:40px">
      <rect x="160" y="120" width="640" height="380" rx="24" fill="var(--bg-1)" stroke="var(--bg-3)" stroke-width="4"/>
      <rect x="196" y="156" width="568" height="308" rx="10" fill="var(--bg-0)"/>
      <rect x="90" y="500" width="780" height="36" rx="14" fill="var(--bg-3)"/>
      <rect x="800" y="330" width="12" height="70" rx="3" fill="var(--color-accent-primary)"/>
      <g transform="translate(840 300) rotate(-8)"><path d="M0 0 h80 l26 26 v120 h-106z" fill="var(--fg-1)"/>
      <text x="53" y="110" text-anchor="middle" font-size="30" font-weight="600" fill="var(--bg-0)">SD</text></g></svg>`,
    pose: "up", at: [900, 520], say: [96, 1060, 888, "Electribe aus. SD-Karte raus und in den Rechner."] },
  { html: files("SD-KARTE › KORG › hacktribe › System", SIDE, [["file", "SYSTEM.VSB"]]),
    spot: [348, 196, 668, 88], pose: "upleft", at: [700, 300], say: [96, 1060, 888, "Erst sichern: <code>SYSTEM.VSB</code> auf den Schreibtisch kopieren."] },
  { html: app(0, 0, 1.93), spot: [24, 506, 818, 98], pose: "left", at: [856, 555], say: [300, 1100, 720, "App öffnen, links auf <b>Patcher</b>."] },
  { html: app(470, 361, 1.421), spot: [12, 390, 1056, 204], pose: "upleft", at: [540, 600], say: [96, 1150, 888, "Die <code>SYSTEM.VSB</code> von der Karte hier reinziehen."] },
  { html: app(470, 150, 1.421), spot: [540, 216, 528, 94], pose: "upleft", at: [800, 330], say: [96, 1100, 888, "Warten, bis die Prüfung durch ist. Dann <b>Speichern</b>."] },
  { html: files("Speichern unter …", SIDE, [["folder", "Programme"], ["folder", "Dokumente"]]),
    spot: [60, 316, 256, 88], pose: "left", at: [330, 360], say: [96, 1060, 888, "Links die <b>SD-Karte</b> wählen."] },
  { html: files("SD-KARTE", SIDE, [["folder", "KORG"]]),
    spot: [348, 196, 668, 88], pose: "upleft", at: [700, 300], say: [96, 1060, 888, "Ordner <b>KORG</b> öffnen."] },
  { html: files("SD-KARTE › KORG", SIDE, [["folder", "electribe"], ["folder", "electribe sampler"], ["folder", "hacktribe"]]),
    spot: [348, 196, 668, 232], pose: "upleft", at: [700, 444], say: [96, 1000, 888, "Deinen Ordner öffnen: <b>hacktribe</b>, <b>electribe sampler</b> oder <b>electribe</b> (blau)."] },
  { html: files("SD-KARTE › KORG › hacktribe", SIDE, [["folder", "Sample"], ["folder", "System"]]),
    spot: [348, 268, 668, 88], pose: "upleft", at: [700, 372], say: [96, 1060, 888, "Ordner <b>System</b> öffnen und speichern."] },
  { html: files("SD-KARTE › KORG › hacktribe › System", SIDE, [["file", "SYSTEM.VSB"]]) +
      `<div class="dialog">„SYSTEM.VSB“ existiert bereits. Ersetzen?<div class="btns"><span class="btn">Abbrechen</span><span class="btn">Ersetzen</span></div></div>`,
    spot: ".dialog .btn:last-child", pose: "up", say: [96, 1060, 888, "Ja, <b>Ersetzen</b>. Dein Original liegt ja auf dem Schreibtisch."] },
  { html: `<svg viewBox="0 0 960 600" width="960" height="600" style="position:absolute;left:60px;top:40px">
      <rect x="60" y="150" width="840" height="380" rx="28" fill="var(--bg-1)" stroke="var(--bg-3)" stroke-width="4"/>
      <rect x="130" y="200" width="300" height="150" rx="8" fill="var(--bg-0)"/>
      ${[0,1,2,3,4,5,6,7].map(i => `<rect x="${130 + i * 90}" y="400" width="70" height="70" rx="10" fill="var(--bg-3)"/>`).join("")}
      <rect x="560" y="140" width="120" height="14" rx="4" fill="var(--color-accent-primary)"/>
      <g transform="translate(567 10)"><path d="M0 0 h80 l26 26 v100 h-106z" fill="var(--fg-1)"/>
      <text x="53" y="90" text-anchor="middle" font-size="30" font-weight="600" fill="var(--bg-0)">SD</text></g></svg>`,
    pose: "left", at: [800, 140], say: [96, 1060, 888, "Karte auswerfen und zurück in die Electribe. Einschalten."] },
  { html: device("lcd-main"), ...onKey(1, "<kbd>MENU</kbd> drücken.") },
  { html: device("lcd-menu"), ...onKey(2, "<b>2×</b> <kbd>EDIT ◀</kbd> drücken.") },
  { html: device("lcd-du"), ...onKey(1, "DATA UTILITY? Dann <kbd>MENU</kbd>.") },
  { html: device("lcd-du1"), ...onKey(3, "<kbd>EDIT ▶</kbd> drücken, bis <b>SOFTWARE UPDATE</b> kommt.") },
  { html: device("lcd-su"), ...onKey(1, "<kbd>MENU</kbd>.") },
  { html: device("lcd-version"), ...onKey(1, "Nochmal <kbd>MENU</kbd>.") },
  { html: device("lcd-sure"), ...onKey(1, "Are You Sure? Ja: <kbd>MENU</kbd>.") },
  { html: `<img class="lcd two" src="img/lcd-working.png" style="left:48px"><img class="lcd two" src="img/lcd-reboot.png" style="left:576px">`,
    spot: [568, 132, 472, 244], pose: "up", at: [804, 410], say: [96, 1000, 888, "Working… <b>nicht ausschalten!</b> Bei OK aus- und wieder einschalten. Fertig!"] },
];

const built = [];
STEPS.forEach((s, i) => {
  const el = document.createElement("section");
  el.className = "slide"; el.id = `s${i}`;
  const p = POSES[s.pose];
  if (typeof s.spot === "string") {  // a spot on an element: measure it, Blechy points at it from below
    el.innerHTML = s.html; document.body.append(el);
    const r = el.querySelector(s.spot).getBoundingClientRect(), o = el.getBoundingClientRect();
    s.spot = [r.left - o.left - 10, r.top - o.top - 10, r.width + 20, r.height + 20];
    s.at = s.pose === "left" ? [r.right - o.left + 30, r.top - o.top + r.height / 2] : [r.left - o.left + r.width / 2, r.bottom - o.top + 20];
  }
  const left = s.at[0] - p.tip[0], top = s.at[1] - p.tip[1];
  const b = n => `<img class="blechy ${p.flip ? "flip" : ""} b${n}" src="img/blechy-${n === 1 ? p.a : p.b}.png" style="left:${left}px;top:${top}px">`;
  el.innerHTML = s.html +
    (s.spot ? `<div class="spot${s.ring ? " ring" : ""}" style="left:${s.spot[0]}px;top:${s.spot[1]}px;width:${s.spot[2]}px;height:${s.spot[3]}px"></div>` : "") +
    b(1) + b(2) +
    `<div class="say" style="left:${s.say[0]}px;width:${s.say[2]}px">${s.say[3]}</div>` +
    `<div class="n">${i + 1}/${STEPS.length}</div>`;
  document.body.append(el);
  built.push(el);
});
// once every picture has its size: the bubble sits right under whatever is lowest: the picture, the spot or Blechy
addEventListener("load", () => built.forEach(el => {
  const o = el.getBoundingClientRect().top;
  const low = Math.max(...[...el.children].filter(c => !c.matches(".say, .n, .b2, .shot")).map(c => c.getBoundingClientRect().bottom - o));
  el.querySelector(".say").style.top = `${Math.round(low + 32)}px`;
}));
</script>
</body>
</html>
