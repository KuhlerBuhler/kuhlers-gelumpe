# electribe 2, header J9 (AM1802) with a Raspberry Pi as the JTAG adapter.
# NOT tested by us - we used a CH347 (see e2-xpack.cfg). Target part and reset settings are the
# ones we use; the pins are those of Hacktribe's public openocd/openocd.cfg.
# Syntax: OpenOCD 0.12. Run from this folder, with root rights (the GPIO driver maps /dev/mem).
#
# Wiring (Pi 40-pin header -> J9, silk print on the board: GND TMS TCK TRST TDI TDO)
#   TCK   GPIO11  pin 23
#   TMS   GPIO25  pin 22
#   TDI   GPIO10  pin 19
#   TDO   GPIO9   pin 21
#   TRST  GPIO7   pin 26
#   GND           pin 6 (or any other ground pin)
# Careful: the interface/raspberrypi-native.cfg of newer OpenOCD builds puts TMS on GPIO8 (pin 24).
# This file sets every pin itself, so it does not depend on that default.

adapter driver bcm2835gpio

# Pi model. OpenOCD 0.12.0 needs both lines; newer builds find the base themselves.
# The speed coefficients only change how exact the JTAG clock is.
#   Pi 1 / Zero / Zero W : peripheral_base 0x20000000   speed_coeffs 113714 28
#   Pi 2                 : peripheral_base 0x3F000000   speed_coeffs 146203 36
#   Pi 3 / Zero 2 W      : peripheral_base 0x3F000000   speed_coeffs 194938 48   (community value)
#   Pi 4                 : peripheral_base 0xFE000000   speed_coeffs 236181 60   (community value)
#   Pi 5                 : this driver does not work there (GPIO sits behind the RP1 chip);
#                          use interface/raspberrypi5-gpiod.cfg of a current OpenOCD instead
bcm2835gpio peripheral_base 0x3F000000
bcm2835gpio speed_coeffs 194938 48

adapter gpio tck  -chip 0 11
adapter gpio tms  -chip 0 25
adapter gpio tdi  -chip 0 10
adapter gpio tdo  -chip 0 9
adapter gpio trst -chip 0 7

# Older OpenOCD (0.11) uses these instead of the five "adapter gpio" lines:
#   bcm2835gpio jtag_nums 11 25 10 9
#   bcm2835gpio trst_num 7

transport select jtag

set CHIPNAME omapl138
source am1802.cfg

# J9 has TRST only, no system reset line.
reset_config trst_only trst_push_pull
adapter speed 500
