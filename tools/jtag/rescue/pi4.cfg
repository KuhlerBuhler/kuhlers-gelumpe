# electribe 2 header J9 with a Raspberry Pi 4 as the bitbang adapter. Used for the debrick of 13.11.2026.
# Jumper wires plugged onto J9, nothing soldered.
#   TCK   GPIO11  pin 23
#   TMS   GPIO5   pin 29
#   TDI   GPIO6   pin 31
#   TDO   GPIO13  pin 33
#   TRST  GPIO26  pin 37
#   GND           pin 39 (or any other ground pin)
# These pins differ from ../e2-raspberrypi.cfg; the shell scripts here watch GPIO5 (TMS pull-up) for power on.
adapter driver bcm2835gpio
bcm2835gpio peripheral_base 0xFE000000
bcm2835gpio speed_coeffs 236181 60
adapter gpio tck 11
adapter gpio tms 5
adapter gpio tdi 6
adapter gpio tdo 13
adapter gpio trst 26
transport select jtag
set CHIPNAME omapl138
source am1802.cfg
reset_config trst_only trst_push_pull
