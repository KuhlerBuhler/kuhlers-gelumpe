constraints:
  - Display 128 x 64 Pixel, hart 1 Bit. "Schwach" geht nur über Dithering (4x4 Bayer). Keine Graustufen.
  - "Dunkelmodus als Standard (Entscheidung des Nutzers 19.10.): ganzer Schirm gesetzt/dunkel, gemalt werden nur helle
    Pixel. Am Gerät beobachtet: Pixel kurz aus und wieder an schmiert weniger als an und wieder aus. Die Invert-Option
    der Firmware soll Default werden; Animationen dafür entwerfen."
  - "LCD ist träge: ohne Dunkelmodus nicht mehr als etwa 4 Bilder sauber, im Dunkelmodus mehr, aber Bewegung großer
    Flächen vermeiden (Nutzeraussage, nicht gemessen)."
  - "Firmware-Budget: der bestehende Lade-Patch braucht rund 6300 ARM-Befehle je Rahmen und darf den Start nicht
    verlängern; Platz für zusätzliche Bilder (je 1024 Byte) ist knapp und muss gesucht werden. Alles Neue: messen."
  - "Bildformat: 1024 Byte, Byte (y/8)*128+x; assets/blechy/splash.bin nutzt Bit 0x80>>(y&7), der Anzeigepuffer
    0xC031B310 Bit y%8. Der Lade-Patch erkennt das BLECH-Bild an der CRC und bringt seit 18.10. ein eigenes mit."
  - Safer Use: Blechy zieht mit Röhrchen, keine überlange Nase (Nutzerwunsch).
  - "Ton der Texte: berlinert, du-Form. Keine Gedankenstriche (em/en dash) irgendwo."
  - Keine Korg-Daten ins Repo. Nichts ans echte Gerät ohne ausdrückliche Freigabe.

character:
  name: Blechy
  description: >
    Heruntergekommene 1-Bit-Nasenfigur: der Körper IST die Nase (dunkler Klumpen), Nasenrücken als Buckel oben links,
    helles Gesichtsfeld mit zwei Augen (dunkle Höhle, helles Auge, dunkle Pupille), doppelte Augenringe, zuckende Braue,
    Stoppeln, Schweiß, Storchenbeine, dünne Arme. "Zehn Jahre Crystal".
  source: "tools/art/make_blechy.py -> assets/blechy/sprites/*.png (56x56, schwarz = gesetzt). Posen: idle, calm,
    angry, happy, sad, walk, wave-1/2, terror-1..4."
  nose_question: >
    Blechy hat eigentlich keine sichtbare Nase; der Nutzer las den hellen Streifen zwischen den Augen als angedeutete
    Nase. Versuche: lange Nase mit Knolle ("Tumor", abgelehnt), lange schmale Nase (zu lang), kurz/mittel/lang
    nebeneinander ("mittel" am akzeptabelsten, gefällt aber nicht wirklich), Stupsnase = Original + 1 px + 2
    Nasenlöcher (in Rotzen benutzt). Nicht entschieden. Die echten Sprites sind unverändert.

tried:
  - name: "Original (vor dieser Session): Splash BLECH mit Terror-Augen, blasses Kuhler's-Dither, Unterstrich =
      Ladebalken, Augen wandern, Gesichter am Rand"
    files: [assets/blechy/splash.png, docs/images/blech-ladebalken-gesicht.png, tools/patch/load_bar.py]
    feedback: >
      Startbild und Ladebild fast gleich; das geditherte "Kuhler's" erkennt man nicht ("vor 5 min erst erkannt");
      angedeutete Augenringe unschön.
  - name: "A: Start = Augen zu (schläft, zZ), Laden = Augen auf und folgen dem Balken, Prozent rechts"
    files: [entwuerfe/design-1.3/geraet/verworfen/]
    feedback: "Prozentanzeige unten rechts gefiel. Pupillen sollen beim Blick zur Seite schnell zittern (später
      wieder verworfen). Schlafende Augen nicht weiter verfolgt."
  - name: "B: Markenbild (Blechy links, BLECH/TRIBE/1.3 rechts)"
    feedback: nicht weiter verfolgt
  - name: "C: Großaufnahme: BLECH löst sich per Dither in Blechys Nase auf, Augen und Strich bleiben, Line wird
      von beiden Enden weggezogen, Tanken/Prozent oben rechts, bei 100 % riesige Pupillen"
    feedback: >
      Idee (Übergang über stehende Augen) gut, aber die gezeichnete Nase passte "null zum Rest" (sah aus wie
      Rakete/Frosch/Glocke). Mit echtem Blechy hochgerechnet: besser, aber Nase falsch -> Nasen-Versuche (siehe oben).
  - name: "D: Layout 2, drei Bänder: oben dunkel BLECH (Impact) + TRIBE (5x14) + FEINSTES/GELUMPE (3x5);
      BLECH ist Umriss und füllt sich als Ladebalken; Mitte hell: Blechy wie Kilroy über einer Mauer; unten Line
      + BY KUHLER_BUHLER"
    files: [entwuerfe/design-1.3/geraet/vorschau/layout2-*.png]
    feedback: >
      "Guter Anfang", vor allem die großen Pupillen am Ende "perfekt". Lange Nase doof. Ausgangspunkt war die
      Skizze des Nutzers: BLECH groß, TRIBE rechts, darunter "Feinstes GELUMPE / by Kuhler_Buhler", halbe
      Bildhöhe, untere Hälfte offen.
  - name: "E: Rotzen v1: Barcode aus gleich langen kurzen Strichen, Blechy zieht einen nach dem anderen,
      Kamera folgt ihm, Titel scrollt links raus, Ladetext kommt von rechts und bleibt links"
    feedback: >
      Hand muss das Röhrchen halten; zog an falscher Stelle (Strich verschwand rechts); Pupillen-Zittern weg;
      Pupillen sollen kontinuierlich wachsen, nicht nur am Ende; Scrollen des ganzen Textes sieht nicht gut aus,
      zu viel Bewegung -> BLECH fest, nur TRIBE/GELUMPE hinter BLECH wegschieben, dann LADEN.
  - name: "F: Rotzen v2/v3 (aktuell), Dunkelmodus, Blechy invertiert"
    files: [entwuerfe/design-1.3/geraet/anim.py, entwuerfe/design-1.3/geraet/vorschau/rotzen.gif]
    feedback: >
      Pupillen in Stufen gewünscht (1 px, 2x2, Kreuz, 3x3, Scheibe, ganzes Auge) - umgesetzt. TRIBE soll erst
      etwas warten, dann wechseln - umgesetzt (2 Striche). Röhrchen gleich lang, immer in der Hand, beim Laufen kurz
      weg und dann wieder an die Nase; er bewegt sich schnell, dann kurze Pause - umgesetzt. Gesamturteil danach:
      "immer noch nicht so schön, wie es sein könnte".
    known_weakness: >
      Invertiert liest sich Blechy schlechter (das Gesichtsfeld wird dunkel und dominiert den Kopf, er wirkt wie
      ein Umriss). Unten ist wenig Platz (Kopf ~23 Zeilen). Röhrchen/Arm sind 1-2 px und verschwimmen mit dem Körper.
  - name: "Ausschaltbild: Blechy winkt (wave-1/2), Text 'Haus'te / rin mein / Akh', dann Bayer-Blende, Röhre
      (gestaucht), Strich, Punkt, dunkel (1 s)"
    files: [entwuerfe/design-1.3/geraet/vorschau/aus-strip.png]
    feedback: "sau geil", Text vom Nutzer vorgegeben. Noch hell auf dunkel gezeichnet (vor Dunkelmodus-Entscheidung).

liked:
  - Große, starrende Pupillen am Ende des Ladens.
  - Pupillen, die mit dem Fortschritt in Stufen wachsen.
  - Prozentanzeige klein unten/rechts.
  - BLECH groß und fest, daneben wechselnde kleine Wörter (TRIBE / FEINSTES GELUMPE -> LADEN).
  - Fortschritt als Reihe gleich langer Striche, die Blechy einzeln zieht; Bewegung schnell, dann Pause.
  - Ausschaltbild mit winkendem Blechy und Röhren-Aus.
disliked:
  - Kuhler's als blasses Dither im Hintergrund (unlesbar).
  - Angedeutete Augenringe im Startbild.
  - Eigene, nicht zum Sprite passende Blechy-Varianten; lange Nase, Knollennase.
  - Dicke Konturlinien am Nasenrücken.
  - Ganzen Bildinhalt scrollen (zu viel Bewegung auf trägem LCD).
  - Pupillen zittern.
  - Röhrchen, das länger wird; Hände, die das Röhrchen loslassen.

decisions:
  - text: Dunkelmodus (Invert) wird Standard, alle Animationen dafür.
  - text: BLECH bleibt im Lade-Bild stehen; nur die Wörter daneben wechseln.
  - text: Safer Use, Röhrchen statt langer Nase.
  - text: "Text/Prozent-Gestaltung bewusst zurückgestellt; Fokus Titel und Rotz-Animation."

findings:
  - text: "Die Pixelschriften: data/script/font.mjs (5x7, Plugin-Display), in render.py zusätzlich eine 3x5-Schrift
      (F3) und eine gestreckte 5x14 (tall). Impact liegt unter /System/Library/Fonts/Supplemental/Impact.ttf."
  - text: "Die Augen im Original-Splash: Mitten x 51 und 78, y 15, Ring r ~9; der alte Balken Zeile 61-62 x 20-107."

