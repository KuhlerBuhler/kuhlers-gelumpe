questions:
  - Welche Nase bekommt Blechy endgültig (und wird sie in die echten Sprites übernommen)?
  - Wie stellt sich Blechy im Dunkelmodus am besten dar?
  - Was steht im Ladetext (LADEN, Tanken, ...) und wie sieht die Prozentzahl aus?
