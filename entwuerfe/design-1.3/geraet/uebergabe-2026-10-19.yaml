goal: >
  Startbild, Ladebild und Ausschaltbild für das Display der Electribe (128 x 64, 1 Bit) neu gestalten, mit dem
  Maskottchen Blechy. Der Nutzer ist mit dem Stand noch nicht zufrieden ("nicht so schön, wie es sein könnte") und
  will, dass eine frische Session das Ganze von Grund auf neu interpretiert. Dieses Dokument fasst zusammen, was schon
  probiert wurde, was dem Nutzer gefallen hat und was nicht.
now: >
  Aktueller Entwurf ist "Rotzen" im Dunkelmodus (geraet/anim.py, vorschau/rotzen.gif): oben BLECH fest links, rechts
  daneben TRIBE / FEINSTES GELUMPE, die nach zwei Strichen hinter BLECH wegrutschen und LADEN + Prozent Platz machen;
  unten Blechy (Sprite invertiert) hinter einer Tischkante, mit Röhrchen in der Hand, zieht kurze Striche nacheinander,
  Pupillen wachsen in Stufen. Alles nur gerendert (PNG/GIF), nichts in Firmware, nichts im Emulator, nichts committet.
