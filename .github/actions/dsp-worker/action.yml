name: Blackfin worker
description: >-
  The QEMU Blackfin worker (tools/dsp/build_qemu.py) for blackfin_swap_cases, from the cache or built. It carries GPL-3
  code of the GNU simulator, so it stays a CI tool: the cache holds it, nothing ships it.
inputs:
  build:
    description: build and save the worker when the cache has none ("false" only restores)
    default: "false"
outputs:
  found:
    description: '"true" when the worker is there after this step'
    value: ${{ steps.check.outputs.found }}
runs:
  using: composite
  steps:
    - id: cache
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/gelumpe-dsp/worker/qemu-bfin-worker
          ~/gelumpe-dsp/worker/gnu/libblackfin-hybrid.so
          ~/gelumpe-dsp/worker/qemu/build/qemu-system-bfin
        key: dsp-worker-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/dsp/**') }}
    - shell: bash
      env:
        BUILD: ${{ inputs.build == 'true' && steps.cache.outputs.cache-hit != 'true' }}
      run: |
        if [ "$BUILD" = true ]; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq libglib2.0-dev libpixman-1-dev libzstd-dev pkg-config texinfo bison flex >/dev/null
          python3 tools/dsp/build_qemu.py ~/gelumpe-dsp/worker --jobs 4
        elif [ -x ~/gelumpe-dsp/worker/qemu-bfin-worker ]; then
          sudo apt-get install -y -qq libglib2.0-0t64 libpixman-1-0 >/dev/null
        fi
    - if: inputs.build == 'true' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          ~/gelumpe-dsp/worker/qemu-bfin-worker
          ~/gelumpe-dsp/worker/gnu/libblackfin-hybrid.so
          ~/gelumpe-dsp/worker/qemu/build/qemu-system-bfin
        key: dsp-worker-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/dsp/**') }}
    - id: check
      shell: bash
      run: echo "found=$([ -x ~/gelumpe-dsp/worker/qemu-bfin-worker ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
