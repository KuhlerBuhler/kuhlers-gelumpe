# A published release goes to the Discord channel behind the webhook in the secret DISCORD_WEBHOOK
# (tools/discord-release.mjs). Started by hand with a tag, it posts that release again, e.g. after its
# notes were edited. Without the secret nothing is posted.
name: Discord release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the release to post, e.g. v1.3.1"
        required: true

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG" ]; then
            gh api "repos/${{ github.repository }}/releases/tags/$TAG" > "$RUNNER_TEMP/release.json"
          else
            cp "$GITHUB_EVENT_PATH" "$RUNNER_TEMP/event.json"
            node -e 'const fs=require("fs");fs.writeFileSync(process.argv[2],JSON.stringify(JSON.parse(fs.readFileSync(process.argv[1],"utf8")).release))' "$RUNNER_TEMP/event.json" "$RUNNER_TEMP/release.json"
          fi
      - name: Post to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: node tools/discord-release.mjs "$RUNNER_TEMP/release.json"
