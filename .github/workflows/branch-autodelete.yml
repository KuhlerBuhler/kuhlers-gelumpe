# When a pull request from a branch of this repository is merged, its branch is deleted. Pull requests from forks are
# ignored. main, develop and release/* are never touched, and neither is a branch that is still the base of an open pull
# request (deleting it through the API would close that pull request instead of retargeting it). A branch closed without
# merging stays.
name: Delete merged branch

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  delete:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete the merged branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
        run: |
          # the branch name comes from the pull request: validate it as a plain name before using it anywhere
          if ! [[ $BRANCH =~ ^[A-Za-z0-9._/-]+$ ]] || [[ $BRANCH == -* || $BRANCH == *..* ]]; then
            echo "::error::Refusing '$BRANCH': not a plain branch name"; exit 1
          fi
          case "$BRANCH" in
            main|develop|release/*) echo "Keeping the long-lived branch $BRANCH"; exit 0 ;;
          esac
          open=$(gh pr list -R "$REPO" --base "$BRANCH" --state open --json number --jq 'length')
          if [ "$open" != 0 ]; then
            echo "Keeping $BRANCH: it is the base of $open open pull request(s)"; exit 0
          fi
          if ! gh api "repos/$REPO/git/refs/heads/$BRANCH" --silent 2>/dev/null; then
            echo "$BRANCH is already gone"; exit 0
          fi
          echo "Deleting $BRANCH"
          gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH"
