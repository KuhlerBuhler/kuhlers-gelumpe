# Checks the current labelled develop pull requests once after a check completes.
name: Automerge

on:
  workflow_run:
    workflows: [Test, Verify patches, Korg data guard, Update pull requests, Build apps, Release, Container image, Discord release, Sync develop]
    types: [completed]
  check_run:
    types: [completed]
  pull_request:
    branches: [develop]
    types: [opened, reopened, synchronize, labeled, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read
  checks: read

concurrency:
  group: automerge
  cancel-in-progress: false

jobs:
  automerge:
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'automerge') &&
       !github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop                # merged code only, and the merge logic that belongs to the PRs it merges
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge ready pull requests
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "no SYNC_TOKEN: nothing is merged"; exit 0
          fi
          node tools/automerge.mjs
