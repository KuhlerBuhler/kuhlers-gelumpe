# Checks the current labelled develop pull requests once after a check completes.
# Only a finished run on the head of a pull request into develop can make one ready: runs on main, develop, release
# branches and tags start nothing, and a run on any other branch only goes on when that branch has a pull request into
# develop (before, every finished workflow of every branch started a run here).
name: Automerge

on:
  workflow_run:
    workflows: [Test, Verify patches, Korg data guard, Update pull requests, Build apps, Release, Container image, Discord release, Sync develop]
    types: [completed]
    branches-ignore: [main, develop, "release/**", "v[0-9]*"]
  check_run:
    types: [completed]
  pull_request:
    branches: [develop]
    types: [opened, reopened, synchronize, labeled, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read
  checks: read

concurrency:
  group: automerge
  cancel-in-progress: false

jobs:
  automerge:
    if: >-
      (github.event_name != 'pull_request' && github.event_name != 'workflow_run') ||
      (github.event_name == 'workflow_run' && contains(github.event.workflow_run.pull_requests.*.base.ref, 'develop')) ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'automerge') &&
       !github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop                # merged code only, and the merge logic that belongs to the PRs it merges
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge ready pull requests
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "no SYNC_TOKEN: nothing is merged"; exit 0
          fi
          node tools/automerge.mjs
