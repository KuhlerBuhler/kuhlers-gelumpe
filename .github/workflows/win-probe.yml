name: Windows Unicorn probe
on:
  workflow_dispatch:
  push:
    branches: [fix/windows-sidecar]
    paths: [".github/workflows/win-probe.yml", "tools/emu/probe/**"]
jobs:
  probe:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install unicorn==2.1.4 pyinstaller
      - name: plain python, main thread
        run: python tools/emu/probe/uc_probe.py main || echo "EXIT $?"
      - name: plain python, threads
        run: python tools/emu/probe/uc_probe.py thread || echo "EXIT $?"
      - name: running code, one case per process
        run: |
          for c in plain cpu exits cpu-exits cpu-exits-mmio mmio; do
            python tools/emu/probe/run_probe.py $c || echo "$c CRASHED exit $?"
          done
      - name: frozen
        run: |
          pyinstaller --onefile --collect-all unicorn --name ucprobe tools/emu/probe/uc_probe.py > /dev/null 2>&1
          ./dist/ucprobe.exe main || echo "EXIT $?"
          ./dist/ucprobe.exe thread || echo "EXIT $?"
          pyinstaller --onefile --collect-all unicorn --paths tools/emu --hidden-import machine --name bootprobe tools/emu/probe/boot_probe.py > /dev/null 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: ucprobe
          path: |
            dist/ucprobe.exe
            dist/bootprobe.exe
