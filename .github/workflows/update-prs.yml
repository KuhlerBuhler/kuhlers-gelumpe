# After every push to a base branch, the open pull requests into that branch that are behind it:
#
# - main and release branches: one gets the branch merged in (GitHub's "Update branch"), the next one in line, so its
#   checks run against what it will be merged into. One per run, because merging the base into every pull request that
#   is behind starts the full CI of all of them at once, after every merge (issue #459). The merge that lands fires this
#   workflow again and the next pull request follows, and the pull request that lands was still tested against the base
#   with every merge before it. `all` from a manual run merges the base into every pull request that is behind.
# - develop: nothing. The runtime patches (data/patches/script-runtime*.json) used to be committed, so a merge into them
#   gave a file no build makes, and this workflow merged develop in, built the three again and pushed. They are built now
#   (tools/patch/ensure-runtime.mjs, AGENTS.md), a push to develop touches no built file, and a conflict against develop
#   needs a person like any other. A pull request that merges cleanly stays as it is: it does not have to be up to date
#   with develop, and merging develop into every open pull request after each merge would start all their checks again.
#   What two pull requests break only together shows up in the runs on develop (Test, Verify patches).
#
# The pushes use the token of Blechy (the repository's GitHub App): a push with the workflow's own token starts no workflow, so the pull request would get no
# new checks. A pull request from a fork, a draft and one whose head is itself a base branch (the sync main -> develop)
# are left alone; tools/ci/pr-queue.mjs picks the one that is next in line.
name: Update pull requests

on:
  push:
    branches: [develop, main, "release/**"]
  workflow_dispatch:
    inputs:
      base:
        description: "Base branch whose pull requests to update, e.g. develop"
        required: true
      all:
        description: "main and release branches: update every pull request that is behind, not only the next one in line"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: update-prs-${{ inputs.base || github.ref_name }}
  cancel-in-progress: true

jobs:
  update:
    if: (inputs.base || github.ref_name) != 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Blechy, the repository's GitHub App: what its token pushes, opens or merges starts the workflows it should, and
      # it shows up as Blechy, not as a person. Without the secrets (a fork) the token stays empty and nothing is done.
      - uses: actions/create-github-app-token@v2
        id: app
        continue-on-error: true
        with:
          app-id: ${{ secrets.BLECHY_APP_ID }}
          private-key: ${{ secrets.BLECHY_APP_KEY }}
      # tools/ci/pr-queue.mjs picks the pull request, that is all this job needs from the repository.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge the base into pull requests that are behind
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BASE: ${{ inputs.base || github.ref_name }}
          REPO: ${{ github.repository }}
          ALL: ${{ inputs.all || 'false' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "no Blechy token: nothing is updated"; exit 0
          fi
          # One row per pull request: number, head, sha, commits behind, draft, fork. The compare call is the only API
          # request per pull request, it starts no workflow.
          gh pr list -R "$REPO" --base "$BASE" --state open --limit 100 \
            --json number,headRefName,headRefOid,isCrossRepository,isDraft \
            --jq '.[] | [.number, .headRefName, .headRefOid, .isCrossRepository, .isDraft] | @tsv' |
          while IFS=$'\t' read -r n head sha fork draft; do
            behind=$(gh api "repos/$REPO/compare/$sha...$BASE" --jq .ahead_by)
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$n" "$head" "$sha" "$behind" "$draft" "$fork"
          done > "$RUNNER_TEMP/prs.tsv"
          node tools/ci/pr-queue.mjs < "$RUNNER_TEMP/prs.tsv" > "$RUNNER_TEMP/queue.tsv"
          if [ ! -s "$RUNNER_TEMP/queue.tsv" ]; then
            echo "nothing behind $BASE"; exit 0
          fi
          # The oldest one first, and the loop stops at the first that took the merge: one merge, one CI run. A pull
          # request that cannot be updated (a conflict) gives the next one its turn.
          while IFS=$'\t' read -r n head sha behind; do
            if out=$(gh api -X PUT "repos/$REPO/pulls/$n/update-branch" -f expected_head_sha="$sha" 2>&1); then
              echo "#$n: $BASE merged in ($behind commits)"
              # Whatever lands next was tested against the base with this merge in it, and landing this one fires the
              # workflow again for the next in line. `all` merges the base into every one that is behind.
              [ "$ALL" = true ] || break
            else
              echo "::warning::#$n ($head) is $behind commits behind $BASE and could not be updated: $out"
            fi
          done < "$RUNNER_TEMP/queue.tsv"
