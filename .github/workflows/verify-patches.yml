# Patch verification runs the selected cases on develop and every case for full checks.
# All four hardware variants use the shared sharded emulator workflow. Only full checks
# write verified.json; unchanged UI pull requests still report the patches gate immediately.
name: Verify patches

on:
  pull_request:
  push:
    branches: [develop]
    # tools/ci/verify-scope.mjs reads this list too (workflowPaths): a pull request outside it skips the check
    paths:
      - "data/patches/**"
      - "!data/patches/verified.json"
      - "data/findings.mjs"
      - "data/hooks.mjs"
      - "data/originals.mjs"
      - "data/emu/**"
      - "data/synth-sites.mjs"
      - "data/map/**"
      - "data/script/**"
      - "data/synth-map/**"
      - "src/bsdiff.mjs"
      - "src/bytes.mjs"
      - "src/bzip2.mjs"
      - "src/firmware.mjs"
      - "src/fx-append.mjs"
      - "src/fx-collection.mjs"
      - "src/fx-v2.mjs"
      - "src/guards.mjs"
      - "src/hooks.mjs"
      - "src/layout.mjs"
      - "src/loading-anim.mjs"
      - "src/map/**"
      - "src/modtable.mjs"
      - "src/patch.mjs"
      - "src/patcher.mjs"
      - "src/preset-file.mjs"
      - "src/presets.mjs"
      - "src/profile.mjs"
      - "src/ramspans.mjs"
      - "src/record.mjs"
      - "src/script/**"
      - "src/units.mjs"
      - "tools/ci/verify-scope.mjs"
      - "tools/ci/firmware-matrix.mjs"
      - "tools/emu/**"
      - "tools/load-gate.mjs"
      - "tools/patch/**"
      - "tools/verify-patches.mjs"
      - ".github/workflows/verify-patches.yml"
      - ".github/workflows/firmware-check.yml"
      - ".github/actions/firmware-input/**"
  workflow_dispatch:
    inputs:
      branch:
        description: Branch whose patch set is checked and that gets the new verified.json
        required: true
        default: develop

permissions:
  contents: read

jobs:
  # The commit all jobs check, so a push to the branch during the hour cannot mix two patch sets.
  ref:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      branch: ${{ steps.sha.outputs.branch }}
      run: ${{ steps.own.outputs.run || steps.paths.outputs.run || 'true' }}
      full: ${{ steps.scope.outputs.full || steps.push.outputs.full || 'true' }}
      cases: ${{ steps.scope.outputs.cases || steps.push.outputs.cases }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - id: sha
        env:
          BRANCH: ${{ inputs.branch || github.head_ref || github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
          REPO: ${{ github.server_url }}/${{ github.repository }}
        run: |
          sha=${HEAD_SHA:-$(git ls-remote --exit-code "$REPO" "refs/heads/$BRANCH" | cut -f1)}
          echo "$BRANCH is at $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
      # A commit of this workflow changes only verified.json, which the check before it wrote: no new check.
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.sha }}
          fetch-depth: 2
      - id: own
        if: github.event_name == 'pull_request'
        run: |
          if [ "$(git diff --name-only HEAD^ HEAD)" = "data/patches/verified.json" ]; then
            echo "::notice::the last commit only changes verified.json, nothing to check."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      # A pull request that changes none of the paths above has nothing to check; "patches" passes without a check.
      - id: paths
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename' > "$RUNNER_TEMP/changed.txt"
          # the API lists at most 3000 files
          [ "$(wc -l < "$RUNNER_TEMP/changed.txt")" -ge 3000 ] && exit 0
          n=$(node --input-type=module -e 'import { readFileSync } from "node:fs"; import { workflowPaths } from "./tools/ci/verify-scope.mjs"; console.log(readFileSync(0, "utf8").split("\n").filter(Boolean).filter(workflowPaths()).length)' < "$RUNNER_TEMP/changed.txt")
          if [ "$n" = 0 ]; then
            echo "::notice::the pull request changes nothing the check is made of, nothing to check."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      # A pull request into develop runs the start scenarios and the case modules of its changed files, and writes nothing.
      - id: scope
        if: github.event_name == 'pull_request' && github.base_ref == 'develop'
        run: |
          if [ "$(wc -l < "$RUNNER_TEMP/changed.txt")" -ge 3000 ]; then cases=all; else cases=$(node tools/ci/verify-scope.mjs < "$RUNNER_TEMP/changed.txt"); fi
          echo "::notice::pull request into develop: start scenarios and cases '${cases:-none}', verified.json stays as it is."
          echo "full=false" >> "$GITHUB_OUTPUT"
          echo "cases=$cases" >> "$GITHUB_OUTPUT"
      # A push to develop runs every case module with the kept task results, so develop's cache stays current.
      - id: push
        if: github.event_name == 'push'
        run: |
          echo "::notice::push to $GITHUB_REF_NAME: every case module with the kept task results, verified.json stays as it is."
          echo "full=false" >> "$GITHUB_OUTPUT"
          echo "cases=all" >> "$GITHUB_OUTPUT"

  verify:
    needs: ref
    if: >-
      needs.ref.outputs.run == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/firmware-check.yml
    with:
      ref: ${{ needs.ref.outputs.sha }}
      branch: ${{ needs.ref.outputs.branch }}
      full: ${{ needs.ref.outputs.full == 'true' }}
      cases: ${{ needs.ref.outputs.cases }}
      shards: ${{ fromJSON(vars.FIRMWARE_SHARDS || '4') }}
    secrets: inherit

  # One check for the four firmware jobs, which automerge.yml waits for: the check passed, or there was nothing to
  # check. A fork's pull request that needs the check (no secrets to run it) fails it.
  patches:
    needs: [ref, verify]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          REF: ${{ needs.ref.result }}
          RUN: ${{ needs.ref.outputs.run }}
          VERIFY: ${{ needs.verify.result }}
        run: |
          [ "$REF" = success ] || { echo "::error::the first job did not pass"; exit 1; }
          if [ "$RUN" = false ]; then echo "nothing to check"; exit 0; fi
          [ "$VERIFY" != skipped ] || { echo "::error::no check ran (a pull request from a fork has no secrets): a person checks and merges it."; exit 1; }
          [ "$VERIFY" = success ]

  join:
    needs: [ref, verify]
    if: needs.ref.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.ref.outputs.sha }}
          token: ${{ secrets.SYNC_TOKEN || github.token }}
      # The joining tool from this workflow's own commit: the checked branch may be older than --results.
      - uses: actions/checkout@v4
        with:
          path: .verify-tool
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: verified-*
          path: ${{ runner.temp }}/verified
      - run: |
          cp data/patches/verified.json .verify-tool/data/patches/verified.json
          node .verify-tool/tools/verify-patches.mjs --results "$RUNNER_TEMP"/verified/*/verified.json
          cp .verify-tool/data/patches/verified.json data/patches/verified.json
          rm -rf .verify-tool
      - name: Commit
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          BRANCH: ${{ needs.ref.outputs.branch }}
          EVENT: ${{ github.event_name }}
        run: |
          { echo '```json'; cat data/patches/verified.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if git diff --quiet -- data/patches/verified.json; then
            echo "::notice::verified.json on $BRANCH already holds all pairs, nothing to commit."
            exit 0
          fi
          git diff -- data/patches/verified.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(patches): refresh verified.json" -m "Checked by the workflow Verify patches, run $GITHUB_RUN_ID." -- data/patches/verified.json
          if [ "$BRANCH" != main ] && [ "$BRANCH" != develop ]; then
            if git push origin "HEAD:refs/heads/$BRANCH"; then
              echo "::notice::pushed the new verified.json to $BRANCH."
              exit 0
            fi
            if [ "$EVENT" = pull_request ]; then
              echo "::warning::$BRANCH moved on during the check; the run for its new head checks again."
              exit 0
            fi
          fi
          head="verified/$BRANCH-$GITHUB_RUN_ID"
          git push origin "HEAD:refs/heads/$head"
          gh pr create --base "$BRANCH" --head "$head" --title "chore(patches): refresh verified.json" \
            --body "The emulator check of the patch set passed on all three of Korg's 2.02 files (workflow Verify patches, run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). This updates the pairs the app skips its own check for."
