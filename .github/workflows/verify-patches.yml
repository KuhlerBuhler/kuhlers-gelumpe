name: Verify patches
run-name: Cold and warm reference (${{ github.ref_name }})

on:
  pull_request:
  push:
    branches: [develop]
    # tools/ci/verify-scope.mjs reads this list too (workflowPaths): a pull request outside it skips the check
    paths:
      - "data/patches/**"
      - "!data/patches/verified.json"
      - "data/findings.mjs"
      - "data/hooks.mjs"
      - "data/originals.mjs"
      - "data/emu/**"
      - "data/synth-sites.mjs"
      - "data/map/**"
      - "data/script/**"
      - "data/synth-map/**"
      - "src/bsdiff.mjs"
      - "src/bytes.mjs"
      - "src/bzip2.mjs"
      - "src/firmware.mjs"
      - "src/fx-append.mjs"
      - "src/fx-collection.mjs"
      - "src/fx-v2.mjs"
      - "src/guards.mjs"
      - "src/hooks.mjs"
      - "src/layout.mjs"
      - "src/loading-anim.mjs"
      - "src/map/**"
      - "src/modtable.mjs"
      - "src/patch.mjs"
      - "src/patcher.mjs"
      - "src/preset-file.mjs"
      - "src/presets.mjs"
      - "src/profile.mjs"
      - "src/ramspans.mjs"
      - "src/record.mjs"
      - "src/script/**"
      - "src/units.mjs"
      - "tools/ci/verify-scope.mjs"
      - "tools/ci/firmware-matrix.mjs"
      - "tools/emu/**"
      - "tools/load-gate.mjs"
      - "tools/patch/**"
      - "tools/verify-patches.mjs"
      - ".github/workflows/verify-patches.yml"
      - ".github/workflows/firmware-check.yml"
      - ".github/actions/firmware-input/**"
  workflow_dispatch:
    inputs:
      branch:
        description: Branch whose patch set is checked and that gets the new verified.json
        required: true
        default: develop

permissions:
  contents: read

jobs:
  # The commit all jobs check, so a push to the branch during the hour cannot mix two patch sets.
  ref:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      branch: ${{ steps.sha.outputs.branch }}
      run: ${{ steps.own.outputs.run || steps.paths.outputs.run || 'true' }}
      full: ${{ steps.scope.outputs.full || steps.push.outputs.full || 'true' }}
      cases: ${{ steps.scope.outputs.cases || steps.push.outputs.cases }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - id: sha
        env:
          BRANCH: ${{ inputs.branch || github.head_ref || github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
          REPO: ${{ github.server_url }}/${{ github.repository }}
        run: |
          sha=${HEAD_SHA:-$(git ls-remote --exit-code "$REPO" "refs/heads/$BRANCH" | cut -f1)}
          echo "$BRANCH is at $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
      # A commit of this workflow changes only verified.json, which the check before it wrote: no new check.
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.sha }}
          fetch-depth: 2
      - id: own
        if: github.event_name == 'pull_request'
        run: |
          if [ "$(git diff --name-only HEAD^ HEAD)" = "data/patches/verified.json" ]; then
            echo "::notice::the last commit only changes verified.json, nothing to check."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      # A pull request that changes none of the paths above has nothing to check; "patches" passes without a check.
      - id: paths
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename' > "$RUNNER_TEMP/changed.txt"
          # the API lists at most 3000 files
          [ "$(wc -l < "$RUNNER_TEMP/changed.txt")" -ge 3000 ] && exit 0
          n=$(node --input-type=module -e 'import { readFileSync } from "node:fs"; import { workflowPaths } from "./tools/ci/verify-scope.mjs"; console.log(readFileSync(0, "utf8").split("\n").filter(Boolean).filter(workflowPaths()).length)' < "$RUNNER_TEMP/changed.txt")
          if [ "$n" = 0 ]; then
            echo "::notice::the pull request changes nothing the check is made of, nothing to check."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      # Feature PRs run start scenarios and cases for their changed files, and write nothing.
      - id: scope
        if: github.event_name == 'pull_request' && (github.base_ref == 'develop' || startsWith(github.base_ref, 'release/'))
        run: |
          if [ "$(wc -l < "$RUNNER_TEMP/changed.txt")" -ge 3000 ]; then cases=all; else cases=$(node tools/ci/verify-scope.mjs < "$RUNNER_TEMP/changed.txt"); fi
          echo "::notice::pull request into $GITHUB_BASE_REF: start scenarios and cases '${cases:-none}', verified.json stays as it is."
          echo "full=false" >> "$GITHUB_OUTPUT"
          echo "cases=$cases" >> "$GITHUB_OUTPUT"
      # A push to develop runs every case module with the kept task results, so develop's cache stays current.
      - id: push
        if: github.event_name == 'push'
        run: |
          echo "::notice::push to $GITHUB_REF_NAME: every case module with the kept task results, verified.json stays as it is."
          echo "full=false" >> "$GITHUB_OUTPUT"
          echo "cases=all" >> "$GITHUB_OUTPUT"

  verify:
    needs: ref
    if: >-
      needs.ref.outputs.run == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/firmware-check.yml
    with:
      ref: ${{ needs.ref.outputs.sha }}
      branch: ${{ needs.ref.outputs.branch }}
      full: ${{ needs.ref.outputs.full == 'true' }}
      cases: ${{ needs.ref.outputs.cases }}
      shards: ${{ fromJSON(vars.FIRMWARE_SHARDS || '4') }}
    secrets: inherit

  # One check for the four firmware jobs, which automerge.yml waits for: the check passed, or there was nothing to
  # check. A fork's pull request that needs the check (no secrets to run it) fails it.
  patches:
    needs: [ref, verify]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          REF: ${{ needs.ref.result }}
          RUN: ${{ needs.ref.outputs.run }}
          VERIFY: ${{ needs.verify.result }}
        run: |
          [ "$REF" = success ] || { echo "::error::the first job did not pass"; exit 1; }
          if [ "$RUN" = false ]; then echo "nothing to check"; exit 0; fi
          [ "$VERIFY" != skipped ] || { echo "::error::no check ran (a pull request from a fork has no secrets): a person checks and merges it."; exit 1; }
          [ "$VERIFY" = success ]
