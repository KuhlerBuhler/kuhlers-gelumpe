# The release, started by the merge of the release pull request into main (docs/development.md, "Release"): when
# package.json names a version without a tag and release-notes/<version>.md exists with a German and an English part, it builds the apps, checks the BLECH
# set on Korg's three 2.02 files in the emulator, builds BLECH.patch, publishes the release, the container image and the Discord post.
# Any other push to main ends after the first job.
#
# The 2.02 files are Korg's and never enter the repo: the job loads them from the links in the secrets E2_VSB_URL
# (Hacktribe), E2_VSB_STOCK_URL (red) and E2_VSB_SYNTH_URL (blue) and stops when a file is not the expected one.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  due:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is released already, nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [ ! -s "release-notes/$version.md" ]; then
            echo "::notice::release-notes/$version.md is missing, no release for $version."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif ! node tools/release-notes.mjs check "release-notes/$version.md"; then
            echo "::warning::release-notes/$version.md needs the German part and the English part under '## English', no release for $version."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: due
    if: needs.due.outputs.release == 'true'
    uses: ./.github/workflows/build-apps.yml
    with:
      version: ${{ needs.due.outputs.version }}
      macos: true
    permissions:
      contents: read
      actions: write

  # The full emulator check (tools/emu/check.py) of the set on each of Korg's 2.02 files, side by side with the build.
  # It starts with no kept task results (no actions/cache, unlike the develop pull requests in verify-patches.yml), so
  # every case of the release runs.
  verify:
    needs: due
    if: needs.due.outputs.release == 'true'
    uses: ./.github/workflows/firmware-check.yml
    with:
      ref: ${{ github.sha }}
      branch: ${{ github.ref_name }}
      full: true
      shards: ${{ fromJSON(vars.FIRMWARE_SHARDS || '4') }}
    secrets: inherit

  verified-pairs:
    needs: [due, verify]
    if: needs.due.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: verified-*
          path: ${{ runner.temp }}/verified
      - name: The pairs in verified.json
        env:
          RESULTS: ${{ runner.temp }}/verified
        run: |
          node --input-type=module <<'JS'
            import { readdirSync, readFileSync } from "node:fs";
            import { join } from "node:path";
            const shipped = JSON.parse(readFileSync("data/patches/verified.json", "utf8")).results;
            for (const dir of readdirSync(process.env.RESULTS)) {
              const fresh = JSON.parse(readFileSync(join(process.env.RESULTS, dir, "verified.json"), "utf8")).results;
              for (const pair of fresh) if (!shipped.some(r => r.input === pair.input && r.output === pair.output && (r.hardware ?? null) === (pair.hardware ?? null))) {
                console.log(`::warning::verified.json lacks ${pair.input.slice(0, 8)} -> ${pair.output.slice(0, 8)}: the app checks this file in its emulator before patching.`);
              }
            }
          JS

  release:
    needs: [due, build, verify, verified-pairs]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      discussions: write
    env:
      VERSION: ${{ needs.due.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: dist-release
          merge-multiple: true
      # BLECH.patch takes Hacktribe's, Korg's red and Korg's blue 2.02 (and Hacktribe with the blue head), a bsdiff for each
      - name: Korg's and Hacktribe's 2.02
        env:
          HACKTRIBE: ${{ secrets.E2_VSB_URL }}
          RED: ${{ secrets.E2_VSB_STOCK_URL }}
          BLUE: ${{ secrets.E2_VSB_SYNTH_URL }}
        run: |
          for name in HACKTRIBE RED BLUE; do [ -n "${!name}" ] || { echo "::error::the secret for $name is not set"; exit 1; }; done
          curl -fsSL "$HACKTRIBE" -o "$RUNNER_TEMP/SYSTEM.VSB"
          curl -fsSL "$RED" -o "$RUNNER_TEMP/RED.VSB"
          curl -fsSL "$BLUE" -o "$RUNNER_TEMP/BLUE.VSB"
          sha256sum -c <<EOF
          7cb4825c184a7e3fa92224304be22a788c96c4b748c277e63a496baa9faae7ee  $RUNNER_TEMP/SYSTEM.VSB
          1d0f0689d5a12c8a8bde9f821f2a59adc5f6cd6012ddb201ebb192b72468a646  $RUNNER_TEMP/RED.VSB
          41fc5f1c33209ef381d1c9fef21a72380bcd8d3431c9c1350a964f5c619ab8b8  $RUNNER_TEMP/BLUE.VSB
          EOF
      - run: npm run -s build:blech-patch -- --vsb "$RUNNER_TEMP/SYSTEM.VSB" --stock "$RUNNER_TEMP/RED.VSB" --synth "$RUNNER_TEMP/BLUE.VSB" --version "$VERSION"
      - run: ls -l dist-release
      - run: node tools/release.mjs dist-release --ci "--notes=release-notes/$VERSION.md" --yes
        env:
          GH_TOKEN: ${{ github.token }}

  # The container image under the same version, so docker-compose.yaml can pull what the release carries
  # instead of building it (docker-image.yml). The release is published by now; a failing push leaves it
  # without an image and turns this run red.
  container:
    needs: [due, release]
    uses: ./.github/workflows/docker-image.yml
    with:
      tag: v${{ needs.due.outputs.version }}
    permissions:
      contents: read
      packages: write

  discord:
    needs: [due, release]
    uses: ./.github/workflows/discord-release.yml
    with:
      tag: v${{ needs.due.outputs.version }}
    secrets: inherit
