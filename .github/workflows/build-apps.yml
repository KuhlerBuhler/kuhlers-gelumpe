# Builds the app for Windows and Linux on GitHub's runners, started by hand (docs/development.md, "Bauen").
# The macOS build comes from a Mac. The files land as artifacts; they go into dist-release/ for npm run release.
name: Build apps

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the files, e.g. 1.0.0 (what npm run release -- next prints)"
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash        # the same commands on Windows, not PowerShell

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            files: src-tauri/target/release/bundle/nsis/*-setup.exe
          - os: ubuntu-22.04
            bundles: appimage,deb
            files: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf python3-venv
      - run: npm ci
      - run: cargo install tauri-cli --version "^2" --locked
      - run: node tools/set-version.mjs "$VERSION"
        env:
          VERSION: ${{ inputs.version }}
      - run: npm run setup:emu
      - run: npm run app:build -- --bundles ${{ matrix.bundles }}
      - name: Start the frozen emulator service once, as the app does
        run: |
          for bin in "src-tauri/binaries/Gelumpe Emulator-"*; do :; done
          "$bin" --port 8791 > sidecar.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:8791/; then echo "answers after $i s"; break; fi
            sleep 1
          done
          cat sidecar.log
          curl -sf -o /dev/null http://127.0.0.1:8791/ || curl -s -o /dev/null -w "%{http_code}\n" http://127.0.0.1:8791/ || (echo "the service does not answer"; exit 1)
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
