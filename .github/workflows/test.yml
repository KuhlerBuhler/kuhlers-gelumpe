# Everything that runs without hardware and without Korg data.
name: Test

on:
  # A pull request is tested by its own run; a push to its branch would be the same run twice.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a branch makes the run before it pointless. The event is part of the group: the pull request that syncs
# main into develop has main as its head and cancelled the push run of the release commit on main (v1.2.0).
concurrency:
  group: test-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # The test files are split across runners with --test-shard (file i goes to part i mod n). Branch protection
  # requires the checks "unit" and "browser", so a job of that name collects the parts.
  # A pull request that changes only Markdown, thoughts/ or other workflows (see changes) runs the unit tests that read
  # those files instead, and no browser tests: with all of them removed the browser suite still passes.
  unit-part:
    name: unit (${{ matrix.part }}/2)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.suites == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    runs-on: ubuntu-latest
    # The suites outgrew 10 minutes (browser 10:19 on PR 27); 20 leaves room before a run counts as hung.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # DESIGN.md against the design.md spec: a broken token reference or a failing contrast pair stops the run.
      # The raw-value check and the spacing check run with the suites (test/raw-values.test.mjs, test/e2e/design.e2e.mjs).
      - if: matrix.part == 1
        run: npx --yes @google/design.md@0.4.0 lint DESIGN.md
      - run: python3 -m pip install -r tools/emu/requirements.txt
      # npm run test:ci with the part: an option after the file pattern would not reach node --test.
      - run: node --test --test-timeout=300000 --test-shard=${{ matrix.part }}/2 "test/*.test.mjs"
        env:
          E2_ARM_REQUIRED: "1"

  unit-docs:
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.result == 'success' && needs.changes.outputs.suites == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Every test file that names a document; the files a test reads through a helper are not Markdown (docs/messungen/*.json, images).
      - run: node --test --test-timeout=300000 $(grep -lE 'docs/|\.md\b|messungen' test/*.test.mjs)

  unit:
    needs: [unit-part, unit-docs]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # One of the two ran and nothing failed; both skipped would be a hole in the conditions, not a pass.
      - run: |
          for r in "${{ needs.unit-part.result }}" "${{ needs.unit-docs.result }}"; do [ "$r" = success ] || [ "$r" = skipped ] || exit 1; done
          [ "${{ needs.unit-part.result }}" = success ] || [ "${{ needs.unit-docs.result }}" = success ]

  browser-part:
    name: browser (${{ matrix.part }}/4)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.suites == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    # The suites outgrew 10 minutes (browser 10:19 on PR 27); 20 leaves room before a run counts as hung.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The runner image ships Chrome and the tests drive that one (channel "chrome"),
      # so there is no browser download to cache or to limit to Chromium.
      - run: node --test --test-timeout=180000 --test-shard=${{ matrix.part }}/4 "test/e2e/*.e2e.mjs"

  browser:
    needs: [changes, browser-part]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # Skipped only for a pull request the filter found to be documents only.
      - run: |
          [ "${{ needs.browser-part.result }}" = success ] || { [ "${{ needs.browser-part.result }}" = skipped ] && [ "${{ needs.changes.result }}" = success ] && [ "${{ needs.changes.outputs.suites }}" = false ]; }

  # What a pull request touches. When this job fails, everything runs.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      native: ${{ steps.filter.outputs.native }}
      suites: ${{ steps.filter.outputs.suites == 'true' || steps.documents.outputs.other == 'true' }}
    steps:
      # A file counts as "other" when it matches every pattern: outside Markdown, thoughts/ and .github/.
      - uses: dorny/paths-filter@v3
        id: documents
        with:
          predicate-quantifier: every
          filters: |
            other:
              - '**'
              - '!**/*.md'
              - '!thoughts/**'
              - '!.github/**'
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # Markdown and workflow files the suites read or run
            suites:
              - 'DESIGN.md'
              - 'docs/plugins.md'
              - 'docs/plugins.en.md'
              - 'third_party/**'
              - '.github/workflows/test.yml'
            native:
              - 'src-tauri/**'
              - 'tools/emu/**'
              - 'tools/patch/**'
              - 'tools/build-site.mjs'
              - 'tools/site-routes.mjs'
              - 'data/patches/**'
              - 'data/synth-map/**'
              - 'data/script/blechy-block.hex'
              - 'assets/blechy/**'
              - 'site/index.html'
              - 'site/app/midi.mjs'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/test.yml'

  # native-midi is not a required check; a pull request that touches nothing it builds or runs skips it.
  native-midi:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.native == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The compiled dependencies, saved by the runs on main, which every pull request can read; without them
      # cargo test and clippy compile the dependencies on every run. Pull requests do not save, so they do not crowd it out.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.event_name == 'push' }}
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev libasound2-dev
      - run: npm ci
      - run: npm run setup:emu
      - run: npm run build:site
      - run: npm run build:sidecar
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Own virtual MIDI ports
        if: runner.os == 'macOS'
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib midi::backend::tests::virtual_ports -- --ignored --nocapture
      - name: WebKit MIDI bridge
        if: runner.os == 'macOS'
        run: cargo run --manifest-path src-tauri/Cargo.toml --example midi-smoke
