name: Firmware check

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      branch:
        type: string
        required: true
      full:
        type: boolean
        required: true
      cases:
        type: string
        default: all
      shards:
        type: number
        default: 4

permissions:
  contents: read

env:
  GELUMPE_JOBS: "4"

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      firmwares: ${{ steps.matrix.outputs.firmwares }}
      parts: ${{ steps.matrix.outputs.parts }}
      smokes: ${{ steps.matrix.outputs.smokes }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - id: matrix
        env:
          SHARDS: ${{ inputs.shards }}
          FULL: ${{ inputs.full }}
          CASES: ${{ inputs.cases }}
        run: node tools/ci/firmware-matrix.mjs "$SHARDS" "$FULL" "$CASES" >> "$GITHUB_OUTPUT"

  # The QEMU Blackfin worker of blackfin_swap_cases and dsp-tube, built once per tools/dsp/ state and kept in the cache for the
  # shards.
  dsp-worker:
    if: (inputs.full || inputs.cases == 'all' || contains(format(',{0},', inputs.cases), ',blackfin_swap_cases,') || contains(format(',{0},', inputs.cases), ',tube_cases,'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/dsp-worker
        with:
          build: "true"

  # The tube curve patches in the QEMU DSP core: off gives Korg's clipper bit for bit, every drive step gives
  # tools/dsp/tube_model.py (tools/dsp/tube_qemu.py). The synth build carries its own patch.
  dsp-tube:
    needs: [plan, dsp-worker]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.dsp-worker.result == 'success' }}
    name: Tube curve DSP ${{ matrix.firmware.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        firmware: ${{ fromJSON(needs.plan.outputs.firmwares) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/firmware-input
        with:
          url: ${{ secrets[matrix.firmware.secret] }}
          sha256: ${{ matrix.firmware.sha256 }}
          blue-head: ${{ matrix.firmware.blue_head }}
      - id: worker
        uses: ./.github/actions/dsp-worker
      - run: '[ "${{ steps.worker.outputs.found }}" = true ]'
      - env:
          PATCH: data/patches/${{ matrix.firmware.name == 'blue' && 'tube-curve-synth.json' || 'tube-curve.json' }}
        run: tools/emu/.venv/bin/python tools/dsp/tube_qemu.py "$RUNNER_TEMP/SYSTEM.VSB" "$PATCH" --worker ~/gelumpe-dsp/worker/qemu-bfin-worker

  shard:
    needs: [plan, dsp-worker]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    name: ${{ matrix.firmware.name }} (${{ matrix.part }}/${{ inputs.shards }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(vars.FIRMWARE_MAX_PARALLEL || (inputs.full && '16' || '8')) }}
      matrix:
        firmware: ${{ fromJSON(needs.plan.outputs.firmwares) }}
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/firmware-input
        with:
          url: ${{ secrets[matrix.firmware.secret] }}
          sha256: ${{ matrix.firmware.sha256 }}
          blue-head: ${{ matrix.firmware.blue_head }}
      # A red copy with the sample swap runs the swap on the executed DSP code too. GELUMPE_DSP_REQUIRED makes check.py plan
      # that case with or without a worker (the shards and the join have to plan the same tasks); without one it fails.
      - id: dsp
        if: (matrix.firmware.name == 'hacktribe' || matrix.firmware.name == 'red') && (inputs.full || inputs.cases == 'all' || contains(format(',{0},', inputs.cases), ',blackfin_swap_cases,'))
        uses: ./.github/actions/dsp-worker
      - name: Develop task results
        if: ${{ !inputs.full }}
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/gelumpe/task
            ~/.cache/gelumpe/task-time
          key: verify-tasks-v3-${{ matrix.firmware.name }}-${{ matrix.part }}.develop.${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: verify-tasks-v3-${{ matrix.firmware.name }}-${{ matrix.part }}.develop.
      - if: ${{ !inputs.full && github.event_name == 'pull_request' }}
        run: |
          mkdir -p "$RUNNER_TEMP/develop" ~/.cache/gelumpe
          for d in task task-time; do [ ! -e ~/.cache/gelumpe/$d ] || mv ~/.cache/gelumpe/$d "$RUNNER_TEMP/develop/"; done
      - name: Pull request task results
        if: ${{ !inputs.full && github.event_name == 'pull_request' }}
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/gelumpe/task
            ~/.cache/gelumpe/task-time
          key: verify-tasks-v3-${{ matrix.firmware.name }}-${{ matrix.part }}.pr.${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: verify-tasks-v3-${{ matrix.firmware.name }}-${{ matrix.part }}.pr.
      - if: ${{ !inputs.full && github.event_name == 'pull_request' }}
        run: |
          for d in task task-time; do
            [ -e "$RUNNER_TEMP/develop/$d" ] || continue
            mkdir -p ~/.cache/gelumpe/$d
            cp -Rpn "$RUNNER_TEMP/develop/$d/." ~/.cache/gelumpe/$d/
          done
      - name: Check assigned tasks
        env:
          FULL: ${{ inputs.full }}
          CASES: ${{ inputs.cases }}
          PART: ${{ matrix.part }}/${{ inputs.shards }}
          GELUMPE_NODE_RESULTS: ${{ !inputs.full && 'strict' || '' }}
          GELUMPE_DSP_REQUIRED: ${{ (matrix.firmware.name == 'hacktribe' || matrix.firmware.name == 'red') && (inputs.full || inputs.cases == 'all' || contains(format(',{0},', inputs.cases), ',blackfin_swap_cases,')) && '1' || '' }}
        run: |
          args=(--shard "$PART" --output "$RUNNER_TEMP/shard.json")
          if [ "$FULL" != true ]; then args+=(--cases "$CASES"); fi
          npm run -s verify:patches -- "${args[@]}" "$RUNNER_TEMP/SYSTEM.VSB"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.firmware.artifact }}-${{ matrix.part }}
          path: ${{ runner.temp }}/shard.json
          if-no-files-found: error
          overwrite: true
          retention-days: 3
      - if: ${{ always() && !inputs.full }}
        run: find ~/.cache/gelumpe/task -type f -mtime +14 -delete 2>/dev/null || true
      - if: ${{ always() && !inputs.full }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/gelumpe/task
            ~/.cache/gelumpe/task-time
          key: verify-tasks-v3-${{ matrix.firmware.name }}-${{ matrix.part }}.${{ github.event_name == 'push' && 'develop' || 'pr' }}.${{ github.run_id }}-${{ github.run_attempt }}

  join:
    needs: [plan, shard]
    # dsp-worker is skipped on most PRs; without this the skip spreads through shard to join.
    if: ${{ !cancelled() && needs.shard.result == 'success' }}
    name: Complete ${{ matrix.firmware.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        firmware: ${{ fromJSON(needs.plan.outputs.firmwares) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/firmware-input
        with:
          url: ${{ secrets[matrix.firmware.secret] }}
          sha256: ${{ matrix.firmware.sha256 }}
          blue-head: ${{ matrix.firmware.blue_head }}
      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ matrix.firmware.artifact }}-*
          path: ${{ runner.temp }}/shards
      - name: Validate complete results
        env:
          FULL: ${{ inputs.full }}
          CASES: ${{ inputs.cases }}
          GELUMPE_NODE_RESULTS: ${{ !inputs.full && 'strict' || '' }}
          GELUMPE_DSP_REQUIRED: ${{ (matrix.firmware.name == 'hacktribe' || matrix.firmware.name == 'red') && (inputs.full || inputs.cases == 'all' || contains(format(',{0},', inputs.cases), ',blackfin_swap_cases,')) && '1' || '' }}
        run: |
          args=(--join-shards "$RUNNER_TEMP/shards")
          if [ "$FULL" != true ]; then args+=(--cases "$CASES"); fi
          npm run -s verify:patches -- "${args[@]}" "$RUNNER_TEMP/SYSTEM.VSB"
      - if: ${{ inputs.full }}
        uses: actions/upload-artifact@v7
        with:
          name: verified-${{ matrix.firmware.name }}
          path: data/patches/verified.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  smoke:
    needs: plan
    name: ${{ matrix.firmware.kind }} ${{ matrix.firmware.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        firmware: ${{ fromJSON(needs.plan.outputs.smokes) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/firmware-input
        with:
          url: ${{ secrets[matrix.firmware.secret] }}
          sha256: ${{ matrix.firmware.sha256 }}
          blue-head: ${{ matrix.firmware.blue_head }}
      # Both tests load blech.json, which names the runtime patches; they are built, not committed
      # (tools/patch/ensure-runtime.mjs), and node --test alone does not build them.
      - run: node tools/patch/ensure-runtime.mjs
      - name: The editor's e2sFx.all in the emulator
        if: matrix.firmware.kind == 'editor' && (inputs.full || inputs.cases == 'all' || contains(format(',{0},', inputs.cases), ',fx_card_cases,'))
        env:
          E2_EMU_REQUIRED: "1"
          E2_VSB: ${{ runner.temp }}/SYSTEM.VSB
        run: node --test test/emulator-fxcard.test.mjs
      - name: The start phase ends at the main screen
        if: matrix.firmware.kind == 'start'
        env:
          E2_EMU_REQUIRED: "1"
          E2_VSB: ${{ matrix.firmware.name == 'hacktribe' && format('{0}/SYSTEM.VSB', runner.temp) || '' }}
          E2_STOCK_VSB: ${{ matrix.firmware.name == 'red' && format('{0}/SYSTEM.VSB', runner.temp) || '' }}
          E2_BLUE_VSB: ${{ matrix.firmware.name == 'blue' && format('{0}/SYSTEM.VSB', runner.temp) || '' }}
        run: node --test --test-timeout=3600000 test/emulator-start-phase.test.mjs

  complete:
    needs: [join, smoke]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - env:
          JOIN: ${{ needs.join.result }}
          SMOKE: ${{ needs.smoke.result }}
        run: '[ "$JOIN" = success ] && [ "$SMOKE" = success ]'
